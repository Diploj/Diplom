<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .main-title { fill: #f0f6fc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 20px; font-weight: 700; }
      .box-client { fill: #161b22; stroke: #388bfd; stroke-width: 2; rx: 10px; }
      .box-backend { fill: #161b22; stroke: #a371f7; stroke-width: 2; rx: 10px; }
      .box-infra { fill: #161b22; stroke: #3fb950; stroke-width: 2; rx: 10px; }
      .box-ml { fill: #161b22; stroke: #f0883e; stroke-width: 2; rx: 10px; }
      .inner-card { fill: #21262d; stroke: #30363d; stroke-width: 1.2; rx: 6px; }
      .tag-client { fill: #58a6ff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0.5px; }
      .tag-backend { fill: #bc8cff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0.5px; }
      .tag-infra { fill: #56d364; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.5px; }
      .tag-ml { fill: #ffa657; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.5px; }
      .card-title { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 14px; font-weight: 600; }
      .card-desc { fill: #8b949e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12px; }
      .badge-bg { fill: #1c2128; stroke: #444c56; stroke-width: 1; rx: 4px; }
      .badge-text { fill: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12px; font-weight: 500; }
    </style>

    <marker id="arrow-blue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#58a6ff" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#bc8cff" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#56d364" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#ffa657" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" class="bg" rx="16" />

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" class="main-title">FaceAttend — Архитектура системы</text>

  <!-- 1. CLIENT LAYER -->
  <rect x="120" y="65" width="660" height="72" class="box-client" />
  <text x="140" y="87" class="tag-client">КЛИЕНТСКИЙ УРОВЕНЬ</text>
  <text x="450" y="105" text-anchor="middle" class="card-title">📱 Android App: FaceAttend (Kotlin / MVVM)</text>
  <text x="450" y="123" text-anchor="middle" class="card-desc">Интерфейсы для студентов, преподавателей и администраторов</text>

  <!-- Arrow: Client -> Backend -->
  <line x1="450" y1="137" x2="450" y2="185" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow-blue)" />
  <rect x="365" y="148" width="170" height="22" class="badge-bg" />
  <text x="450" y="163" text-anchor="middle" class="badge-text">REST API / JWT</text>

  <!-- 2. BACKEND LAYER -->
  <rect x="80" y="195" width="740" height="195" class="box-backend" />
  <text x="105" y="218" class="tag-backend">СЕРВЕРНАЯ ЧАСТЬ (.NET 8 Web API)</text>

  <!-- API Level -->
  <rect x="105" y="230" width="690" height="38" class="inner-card" />
  <text x="450" y="254" text-anchor="middle" class="card-title">Diplom — API Контроллеры (Auth, Attendance, Lecture, Student...)</text>

  <!-- Arrow: API -> BL -->
  <line x1="450" y1="268" x2="450" y2="283" stroke="#bc8cff" stroke-width="2" marker-end="url(#arrow-purple)" />

  <!-- BL Level -->
  <rect x="105" y="291" width="690" height="38" class="inner-card" />
  <text x="450" y="315" text-anchor="middle" class="card-title">Diplom.BL — Сервисы и бизнес-логика (сопоставление лиц, обработка даных)</text>

  <!-- Sub-layers: Data & ML-Client -->
  <rect x="105" y="342" width="335" height="36" class="inner-card" />
  <text x="272" y="365" text-anchor="middle" class="card-title">Diplom.Data (репозитории)</text>

  <rect x="460" y="342" width="335" height="36" class="inner-card" />
  <text x="627" y="365" text-anchor="middle" class="card-title">Diplom.Client (HTTP-клиент)</text>

  <!-- Small internal arrows to Data & Client -->
  <line x1="272" y1="329" x2="272" y2="336" stroke="#bc8cff" stroke-width="1.5" marker-end="url(#arrow-purple)" />
  <line x1="627" y1="329" x2="627" y2="336" stroke="#bc8cff" stroke-width="1.5" marker-end="url(#arrow-purple)" />

  <!-- 3. DOWNWARD ARROWS TO STORAGE & ML (Clean with safety margin) -->
  <!-- Arrow to DB -->
  <line x1="200" y1="390" x2="200" y2="455" stroke="#56d364" stroke-width="2" marker-end="url(#arrow-green)" />
  <rect x="145" y="412" width="110" height="20" class="badge-bg" />
  <text x="200" y="426" text-anchor="middle" class="badge-text">База данных</text>

  <!-- Arrow to MinIO -->
  <line x1="450" y1="390" x2="450" y2="455" stroke="#56d364" stroke-width="2" marker-end="url(#arrow-green)" />
  <rect x="385" y="412" width="130" height="20" class="badge-bg" />
  <text x="450" y="426" text-anchor="middle" class="badge-text">Хранилище фото</text>

  <!-- Arrow to ML Service -->
  <line x1="700" y1="390" x2="700" y2="455" stroke="#ffa657" stroke-width="2" marker-end="url(#arrow-orange)" />
  <rect x="625" y="412" width="150" height="20" class="badge-bg" />
  <text x="700" y="426" text-anchor="middle" class="badge-text">Поиск лиц и векторов</text>

  <!-- 4. BOTTOM TIER: DB, MINIO, ML -->
  <!-- PostgreSQL -->
  <rect x="80" y="465" width="240" height="90" class="box-infra" />
  <text x="200" y="490" text-anchor="middle" class="tag-infra">БАЗА ДАННЫХ</text>
  <text x="200" y="515" text-anchor="middle" class="card-title">🐘 PostgreSQL</text>
  <text x="200" y="535" text-anchor="middle" class="card-desc">Пользователи, посещаемость и т.д.</text>

  <!-- MinIO -->
  <rect x="330" y="465" width="240" height="90" class="box-infra" />
  <text x="450" y="490" text-anchor="middle" class="tag-infra">ОБЪЕКТНОЕ ХРАНИЛИЩЕ</text>
  <text x="450" y="515" text-anchor="middle" class="card-title">🗄️ MinIO S3</text>
  <text x="450" y="535" text-anchor="middle" class="card-desc">Фотографии студентов и аудиторий</text>

  <!-- ML Recognition -->
  <rect x="580" y="465" width="240" height="90" class="box-ml" />
  <text x="700" y="490" text-anchor="middle" class="tag-ml">Распознование лиц (CV)</text>
  <text x="700" y="515" text-anchor="middle" class="card-title">🧠 Face Recognition</text>
  <text x="700" y="535" text-anchor="middle" class="card-desc">FastAPI / InsightFace (buffalo_l)</text>
</svg>
